name: Open-Source Opus Clip Generator Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  render-viral-clips:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository Branch
      uses: actions/checkout@v4

    - name: Configure Python Runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject System Media Processing Binaries (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick libmagick++-dev
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

    - name: Configure Node.js Runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Runtime Core Dependencies
      run: |
        npm install
        python -m pip install --upgrade pip
        pip install supabase google-genai moviepy requests

    - name: Execute Clipper Wrapper Architecture
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npx tsx src/clipperEngine.ts