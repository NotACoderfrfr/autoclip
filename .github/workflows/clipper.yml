name: AutoClip Processor Engine

on:
  # Automatically runs every hour on the hour to check for new videos
  schedule:
    - cron: '0 * * * *'
  # Allows you to manually click a button to force it to run instantly for testing
  workflow_dispatch:

jobs:
  run-clipper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environmental runtime
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install system multimedia dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version

    - name: Install project dependencies
      run: npm install

    - name: Execute Clipper Automation Engine
      run: npx ts-node --esm src/clipperEngine.ts
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}