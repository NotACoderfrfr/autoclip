name: AutoClip Processor Engine

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-clipper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environmental runtime
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install system multimedia dependencies (FFmpeg & yt-dlp)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
        sudo chmod a+rx /usr/local/bin/yt-dlp
        ffmpeg -version
        yt-dlp --version

    - name: Install project dependencies
      run: npm install

    - name: Create Cookies File
      run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

    - name: Execute Clipper Automation Engine
      run: npx tsx src/clipperEngine.ts
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HF_API_KEY: ${{ secrets.HF_API_KEY }}